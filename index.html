<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Analizador de Competencia Local</title>
<style>
  body{font-family:Inter,Arial,Helvetica,sans-serif;background:#f6f7fb;margin:0;padding:24px}
  .card{max-width:900px;margin:20px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(9,30,66,0.08)}
  h1{margin:0 0 10px;font-size:22px}
  label{font-weight:600;font-size:13px;color:#333}
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #d9dff0;margin-top:6px;margin-bottom:12px;font-size:14px}
  button{background:#0b63ff;color:#fff;padding:10px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .row{display:flex;gap:12px}
  .col{flex:1}
  .summary{background:#f1f6ff;padding:12px;border-radius:8px;margin-top:12px}
  .list-item{padding:10px;border-radius:8px;background:#fbfdff;border:1px solid #eef3ff;margin-top:10px}
  .meta{font-size:13px;color:#555;margin-top:6px}
  .badge{display:inline-block;padding:6px 8px;border-radius:999px;font-weight:700;}
  .low{background:#e6fff0;color:#036a3e}
  .medium{background:#fff6e6;color:#a16b00}
  .high{background:#ffe6e6;color:#8a0000}

  /* Modal flotante */
  .modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
  .modal-content{background:#fff;padding:20px;border-radius:10px;max-width:600px;width:90%;position:relative;max-height:80vh;overflow-y:auto}
  .modal-content h3{margin-top:0}
  .close-btn{position:absolute;top:10px;right:10px;background:#ff4d4d;color:white;border:none;padding:5px 10px;border-radius:5px;font-weight:bold;cursor:pointer}
  .advantage{color:green;margin-bottom:5px}
  .disadvantage{color:red;margin-bottom:5px}
</style>
</head>
<body>

<div class="card">
  <h1>Analizador de Competencia Local</h1>
  <p class="small">Ingresa un <strong>nicho o tipo de negocio</strong> y la <strong>ciudad / zona</strong>. La app mostrará competidores, su reputación y ventajas/desventajas competitivas.</p>

  <label>Qué quieres analizar (nicho / negocio)</label>
  <input id="q" placeholder="Ej: lavandería, gimnasio, taller mecánico">

  <label>Lugar (ciudad, provincia, barrio)</label>
  <input id="loc" placeholder="Ej: San Cristóbal, Santo Domingo, Santiago">

  <div class="row">
    <div class="col">
      <label>Número de resultados a mostrar</label>
      <select id="limit">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
      </select>
    </div>
    <div class="col">
      <label>Filtrar por (opcional)</label>
      <input id="filter" placeholder="p.ej. 'servicio', 'venta', 'precio' (palabra clave)">
    </div>
  </div>

  <div style="margin-top:10px;display:flex;gap:8px">
    <button id="btnSearch" onclick="runAnalysis()">Analizar ahora</button>
    <button id="btnCSV" onclick="downloadCSV()" disabled>Descargar CSV</button>
  </div>

  <div id="status" class="summary" style="display:none;margin-top:14px"></div>
  <div id="resultsArea"></div>
</div>

<div id="modal" class="modal-bg">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">X</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const apiKey = "AIzaSyBQxW18C0o3crY0Wn7ty8gvF4G6DllVo4k"; // Recuerda usar tu propia API Key
const cx = "23fb969721a4f4658"; // Recuerda usar tu propio CX ID

function setStatus(html, visible=true){
  const s = document.getElementById('status');
  s.style.display = visible ? 'block' : 'none';
  s.innerHTML = html;
}

async function runAnalysis(){
  const q = (document.getElementById('q').value || "").trim();
  const loc = (document.getElementById('loc').value || "").trim();
  const limit = parseInt(document.getElementById('limit').value || "10");
  const filter = (document.getElementById('filter').value || "").trim().toLowerCase();
  if(!q || !loc){ alert('Ingresa nicho y lugar.'); return; }

  document.getElementById('btnSearch').disabled = true;
  document.getElementById('btnCSV').disabled = true;
  setStatus('Buscando en Google... esto puede tardar unos segundos');

  const query = `${q} ${loc}`;
  const url = `https://www.googleapis.com/customsearch/v1?key=${apiKey}&cx=${cx}&q=${encodeURIComponent(query)}&num=${limit}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    const totalResults = parseInt(data.searchInformation?.totalResults || 0);
    let level = 'Baja', levelClass='low';
    if(totalResults < 3000){ level='Baja'; levelClass='low'; }
    else if(totalResults < 15000){ level='Media'; levelClass='medium'; }
    else { level='Alta'; levelClass='high'; }

    const items = (data.items || []).slice(0, limit).map(it => {
      const title = it.title || "";
      const link = it.link || "";
      const snippet = it.snippet || "";
      const lowerSnippet = snippet.toLowerCase();
      const positive = (snippet.match(/(excelente|bueno|recomendado|positivo|5 estrellas|5-star|top|mejor|recomiendan)/gi) || []).length;
      const negative = (snippet.match(/(malo|queja|estafa|fraude|reclam|problema|defectuoso|mala reseña|denunci)/gi) || []).length;
      const repScore = Math.max(0, Math.min(100, 60 + (positive - negative)*15));
      const prices = snippet.match(/(?:RD\$|\$|USD|EUR)?\s?([0-9]{1,3}(?:[.,][0-9]{3})*(?:[.,][0-9]{1,2})?)/g) || [];

      let advantages = [], disadvantages = [];
      
      // Análisis de Ubicación
      if(lowerSnippet.includes('centro') || lowerSnippet.includes('cercano') || lowerSnippet.includes('céntrico')){
        advantages.push('Ubicación céntrica / fácil acceso');
      } else {
        disadvantages.push('Lejos del centro / acceso limitado');
      }
      
      // Análisis de Precios
      if(prices.length){
        advantages.push(`Precios aproximados: ${prices.join(', ')}`);
      } else {
        disadvantages.push('Precios no disponibles o altos');
      }
      
      // Análisis de Reputación
      if(repScore>75){
        advantages.push('Popularidad alta entre reseñas');
      } else {
        disadvantages.push('Baja popularidad o pocas reseñas positivas');
      }
      if(positive>negative){
        advantages.push('Opiniones mayormente positivas');
      } else if(negative>positive){
        disadvantages.push('Opiniones negativas predominantes');
      }

      // --- ¡NUEVO! Análisis de Horarios ---
      if(lowerSnippet.match(/(24 horas|24\/7|siempre abierto)/gi)){
        advantages.push('Servicio 24 horas');
      } else if (lowerSnippet.match(/(horario|abierto|l-v|lunes a viernes|semana|fin de semana)/gi)) {
        advantages.push('Información de horario detectada');
      } else {
        disadvantages.push('No se menciona horario de servicio');
      }

      return { title, link, snippet, positive, negative, repScore, prices, advantages, disadvantages };
    });

    let html = `<div class="summary"><strong>Consulta:</strong> ${escapeHtml(query)} &nbsp; • &nbsp; <strong>Resultados estimados:</strong> ${totalResults}</div>`;
    html += `<div style="margin-top:10px"><strong>Nivel de competencia:</strong> <span class="badge ${levelClass}">${level}</span></div>`;

    items.forEach((it, idx)=>{
      html += `<div class="list-item">
        <strong>${idx+1}. ${escapeHtml(it.title)}</strong>
        <div class="meta">Reputación: ${it.repScore}/100</div>
        <div style="margin-top:6px"><button onclick="openModal(${idx})">Detalles</button></div>
      </div>`;
    });

    document.getElementById('resultsArea').innerHTML = html;
    window.lastAnalysis = { query, loc, totalResults, level, items };
    document.getElementById('btnCSV').disabled = false;
    setStatus('Análisis completado.', true);

  } catch(err){
    console.error(err);
    setStatus('Error al consultar la API.', true);
    document.getElementById('resultsArea').innerHTML = '';
  } finally { document.getElementById('btnSearch').disabled = false; }
}

function openModal(idx){
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  const item = window.lastAnalysis.items[idx];
  if(!item) return;
  
  let html = `<h3>${escapeHtml(item.title)}</h3>`;
  html += `<p><strong>Reputación:</strong> ${item.repScore}/100</p>`;
  html += `<p><strong>Snippet:</strong> ${escapeHtml(item.snippet)}</p>`;
  html += `<p><strong>Link:</strong> <a href="${item.link}" target="_blank">${item.link}</a></p>`;
  html += `<h4>Ventajas competitivas:</h4>`;
  html += item.advantages.length ? '<ul>'+item.advantages.map(a=>'<li class="advantage">'+escapeHtml(a)+'</li>').join('')+'</ul>' : '<p class="advantage">No detectadas</p>';
  html += `<h4>Desventajas:</h4>`;
  html += item.disadvantages.length ? '<ul>'+item.disadvantages.map(d=>'<li class="disadvantage">'+escapeHtml(d)+'</li>').join('')+'</ul>' : '<p class="disadvantage">No detectadas</p>';
  
  body.innerHTML = html;
  modal.style.display = 'flex';
}

function closeModal(){ document.getElementById('modal').style.display = 'none'; }

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function downloadCSV(){
  if(!window.lastAnalysis) return alert('No hay datos para exportar. Haz un análisis primero.');
  const rows = [['title','link','snippet','repScore','positive','negative','advantages','disadvantages']];
  window.lastAnalysis.items.forEach(it=>{
    rows.push([it.title,it.link,it.snippet,it.repScore,it.positive,it.negative,it.advantages.join('|'),it.disadvantages.join('|')]);
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${(window.lastAnalysis.query+'_'+window.lastAnalysis.loc).replace(/\s+/g,'_')}_competencia.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
</script>
</body>
</html>
